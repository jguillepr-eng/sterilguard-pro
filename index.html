<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SterilGuard Pro - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .status-pill {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- App Container -->
    <div id="app" class="max-w-6xl mx-auto pb-20">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 p-4 md:p-6 glass-effect mb-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-600 p-3 rounded-2xl shadow-lg shadow-blue-200">
                        <i data-lucide="cloud-lightning" class="text-white w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-extrabold tracking-tighter italic uppercase">Steril<span class="text-blue-600">Guard</span></h1>
                        <div class="flex items-center gap-2">
                            <span id="connection-status" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sincronización Global Activa</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button onclick="changeView('log')" id="nav-log" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-all bg-white shadow-sm text-blue-600">
                        Registros
                    </button>
                    <button onclick="changeView('stats')" id="nav-stats" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-all text-slate-500">
                        Análisis
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="px-4 md:px-6">
            
            <!-- View: Log -->
            <div id="view-log" class="space-y-6 animate-pop">
                <!-- Form Card -->
                <section class="bg-white rounded-[2.5rem] p-6 md:p-8 shadow-xl shadow-slate-200/50 border border-slate-100">
                    <div class="flex items-center gap-3 mb-6">
                        <i data-lucide="plus-circle" class="text-blue-500 w-5 h-5"></i>
                        <h2 class="text-lg font-black text-slate-800 uppercase tracking-tight">Nueva Entrada Operativa</h2>
                    </div>
                    
                    <form id="main-form" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Fecha</label>
                            <input type="date" name="fecha" required class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl outline-none focus:ring-2 ring-blue-500/20 font-bold">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Turno</label>
                            <select name="turno" class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl outline-none font-bold">
                                <option>Mañana</option>
                                <option>Tarde</option>
                                <option>Noche</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Equipo ID</label>
                            <input type="text" name="equipo" placeholder="Ej: ST-01" required class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl outline-none font-bold uppercase">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Operador</label>
                            <input type="text" name="operador" placeholder="Nombre" required class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl outline-none font-bold">
                        </div>
                        
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-emerald-600 uppercase ml-1">Estado</label>
                            <select name="estado" class="w-full bg-emerald-50 border-emerald-100 p-3 rounded-xl outline-none font-bold text-emerald-700">
                                <option value="Operativo">Operativo</option>
                                <option value="Falla">En Falla</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-rose-600 uppercase ml-1">Minutos Paro</label>
                            <input type="number" name="minutos" value="0" min="0" class="w-full bg-rose-50 border-rose-100 p-3 rounded-xl outline-none font-bold text-rose-700">
                        </div>
                        <div class="md:col-span-2 space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Observaciones</label>
                            <input type="text" name="notas" placeholder="Detalle de la actividad..." class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl outline-none font-medium">
                        </div>
                        
                        <div class="md:col-span-3 lg:col-span-4 mt-2">
                            <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase tracking-widest text-xs hover:bg-blue-600 transition-all flex items-center justify-center gap-2 shadow-lg active:scale-[0.98]">
                                <i data-lucide="send" class="w-4 h-4"></i> Sincronizar en todos los dispositivos
                            </button>
                        </div>
                    </form>
                </section>

                <!-- Data Table -->
                <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Base de Datos Centralizada</h3>
                        <button onclick="exportData()" class="text-blue-600 text-[10px] font-black uppercase flex items-center gap-1 hover:underline">
                            <i data-lucide="download" class="w-3 h-3"></i> Exportar CSV
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="text-[10px] font-black text-slate-400 uppercase border-b border-slate-50">
                                    <th class="px-6 py-4 text-left">Referencia</th>
                                    <th class="px-6 py-4 text-left">Equipo</th>
                                    <th class="px-6 py-4 text-center">Estado</th>
                                    <th class="px-6 py-4 text-left">Observaciones</th>
                                    <th class="px-6 py-4 text-right">Tiempo</th>
                                    <th class="px-6 py-4 text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="data-table" class="divide-y divide-slate-50">
                                <!-- Datos dinámicos -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- View: Stats -->
            <div id="view-stats" class="hidden space-y-8 animate-pop">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Disponibilidad Global</p>
                        <h4 id="stat-disp" class="text-5xl font-black text-blue-600 italic">0%</h4>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Total Inactividad</p>
                        <h4 id="stat-paro" class="text-5xl font-black text-rose-500 italic">0h</h4>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Registros Cloud</p>
                        <h4 id="stat-count" class="text-5xl font-black text-slate-800 italic">0</h4>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                    <h3 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-8">Tendencia de Paro Mensual</h3>
                    <div class="h-64">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-x-[150%] transition-transform duration-500">
        <div class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                <i data-lucide="cloud-check" class="w-4 h-4 text-white"></i>
            </div>
            <p id="toast-text" class="text-[10px] font-black uppercase tracking-widest">Sincronizado</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // --- Firebase Config ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sterilguard-prod-v1';
        
        let registros = [];
        let myChart = null;

        // --- Auth & Sync ---
        const init = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'operaciones'));
                onSnapshot(q, (snapshot) => {
                    registros = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    registros.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
                    renderAll();
                }, (error) => {
                    console.error("Sync Error:", error);
                });
            }
        });

        init();

        // --- UI Logic ---
        window.changeView = (view) => {
            document.getElementById('view-log').classList.toggle('hidden', view !== 'log');
            document.getElementById('view-stats').classList.toggle('hidden', view !== 'stats');
            
            document.getElementById('nav-log').className = view === 'log' 
                ? "flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-all bg-white shadow-sm text-blue-600"
                : "flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-all text-slate-500";
            
            document.getElementById('nav-stats').className = view === 'stats'
                ? "flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-all bg-white shadow-sm text-blue-600"
                : "flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-all text-slate-500";
            
            if(view === 'stats') renderChart();
            lucide.createIcons();
        };

        const form = document.getElementById('main-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            const data = {
                fecha: fd.get('fecha'),
                turno: fd.get('turno'),
                equipo: fd.get('equipo').toUpperCase(),
                operador: fd.get('operador'),
                estado: fd.get('estado'),
                minutos: parseInt(fd.get('minutos')),
                notas: fd.get('notas'),
                createdAt: Date.now()
            };

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'operaciones'), data);
                showToast("Dato Sincronizado");
                form.reset();
                document.querySelector('[name="fecha"]').valueAsDate = new Date();
            } catch (err) {
                console.error(err);
            }
        });

        window.deleteItem = async (id) => {
            if(confirm("¿Eliminar este registro de la nube?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'operaciones', id));
                showToast("Registro Eliminado");
            }
        };

        function renderAll() {
            const table = document.getElementById('data-table');
            table.innerHTML = registros.map(r => `
                <tr class="hover:bg-slate-50/50 transition-colors group">
                    <td class="px-6 py-4">
                        <div class="text-[12px] font-bold text-slate-800">${r.fecha}</div>
                        <div class="text-[9px] font-black text-slate-400 uppercase">${r.turno}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-[12px] font-black text-blue-600">${r.equipo}</div>
                        <div class="text-[9px] font-bold text-slate-400 uppercase">${r.operador}</div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="status-pill ${r.estado === 'Operativo' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${r.estado}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-[11px] text-slate-600 font-medium italic">${r.notas || '-'}</div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="text-[12px] font-black text-slate-700">${r.minutos}m</div>
                        <div class="text-[9px] font-bold text-slate-400 uppercase">${(r.minutos/60).toFixed(1)}h</div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteItem('${r.id}')" class="p-2 text-slate-300 hover:text-rose-500 transition-colors opacity-0 group-hover:opacity-100">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            
            // Stats simple
            const totalMin = registros.reduce((acc, curr) => acc + curr.minutos, 0);
            document.getElementById('stat-count').innerText = registros.length;
            document.getElementById('stat-paro').innerText = (totalMin/60).toFixed(1) + 'h';
            
            const totalH = 30 * 24; // Base 30 dias
            const disp = Math.max(0, 100 - ((totalMin/60) / totalH * 100)).toFixed(1);
            document.getElementById('stat-disp').innerText = disp + '%';

            lucide.createIcons();
        }

        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const dataMap = {};
            registros.forEach(r => {
                dataMap[r.fecha] = (dataMap[r.fecha] || 0) + r.minutos;
            });
            const sortedDates = Object.keys(dataMap).sort();
            
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedDates.map(d => d.split('-')[2]),
                    datasets: [{
                        label: 'Minutos Paro',
                        data: sortedDates.map(d => dataMap[d]),
                        backgroundColor: '#2563eb',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { display: false } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            t.classList.remove('translate-x-[150%]');
            setTimeout(() => t.classList.add('translate-x-[150%]'), 3000);
        }

        window.exportData = () => {
            let csv = "Fecha,Turno,Equipo,Operador,Estado,Minutos,Notas\n";
            registros.forEach(r => {
                csv += `${r.fecha},${r.turno},${r.equipo},${r.operador},${r.estado},${r.minutos},${r.notas}\n`;
            });
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SterilGuard_Cloud_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        };

        window.addEventListener('load', () => {
            document.querySelector('[name="fecha"]').valueAsDate = new Date();
            lucide.createIcons();
        });
    </script>
</body>
</html>
